services:
  web:
    build: .
    container_name: objetos-perdidos
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
  
  db:
    image: mysql:lts
    container_name: t08ej02
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: objetos_perdidos
      MYSQL_USER: user
      MYSQL_PASSWORD: 1234
    ports:
      - "3306:3306"
    #volumes:
    #  - db_data:/var/lib/mysql